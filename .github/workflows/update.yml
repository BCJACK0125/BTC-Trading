name: Update signal & deploy dashboard

on:
  schedule:
    # 7 minutes after every 4h candle close (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["btc_signal/**", "scripts/**", "docs/**", "config/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q tests

      # Incremental kline cache: each run restores the newest cache and only fetches new bars.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: klines-${{ github.run_id }}
          restore-keys: klines-

      # Fails when Pages is not enabled (or the repo is private on a free plan). The signal,
      # the cached signal log and notifications still work; only the deploy is skipped.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - if: steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages is not enabled for this repo, so the dashboard will not be deployed. Settings > Pages > Source = GitHub Actions (private repos need a paid plan)."

      - name: Compute signal
        env:
          # previous signal log is recovered from the live site before appending
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # optional push notifications on signal changes (Settings > Secrets and variables > Actions)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # email (e.g. Gmail with an app password); SMTP_HOST / SMTP_PORT default to smtp.gmail.com:465
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python scripts/update.py

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # GitHub disables scheduled workflows in a public repo after 60 days without repository
  # activity, and the signal run never commits. Leave an empty commit once the repo has been
  # quiet for 45 days (a push made with GITHUB_TOKEN does not trigger another run).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit when the repo has been quiet for 45 days
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit ${age} days ago"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: keep scheduled updates enabled (${age} days without commits)"
            git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
